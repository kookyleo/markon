    <filter id="panel-shadow" x="-18%" y="-16%" width="136%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#27313A" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#FAFAF7"/>

