      <rect x="166" y="322" width="56" height="30" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
      <text x="194" y="342" fill="#4C565D">⌘ Z</text>
      <rect x="238" y="333" width="98" height="7" rx="3.5" fill="#919AA0"/>

      <rect x="166" y="374" width="50" height="30" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
      <text x="191" y="394" fill="#4C565D">Esc</text>
      <rect x="232" y="385" width="128" height="7" rx="3.5" fill="#919AA0"/>

      <rect x="166" y="426" width="56" height="30" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
      <text x="194" y="446" fill="#4C565D">⌘ K</text>
      <rect x="238" y="437" width="104" height="7" rx="3.5" fill="#919AA0"/>

      <rect x="166" y="478" width="64" height="30" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
      <text x="198" y="498" fill="#4C565D">Space</text>
      <rect x="246" y="489" width="112" height="7" rx="3.5" fill="#919AA0"/>

      <rect x="422" y="258" width="38" height="30" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
      <text x="441" y="278" fill="#4C565D">/</text>
      <rect x="476" y="269" width="132" height="7" rx="3.5" fill="#919AA0"/>

      <rect x="422" y="322" width="38" height="30" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
      <text x="441" y="342" fill="#4C565D">E</text>
      <rect x="476" y="333" width="114" height="7" rx="3.5" fill="#919AA0"/>

      <rect x="422" y="374" width="38" height="30" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
      <text x="441" y="394" fill="#4C565D">V</text>
      <rect x="476" y="385" width="126" height="7" rx="3.5" fill="#919AA0"/>

      <rect x="422" y="426" width="38" height="30" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
      <text x="441" y="446" fill="#4C565D">L</text>
      <rect x="476" y="437" width="102" height="7" rx="3.5" fill="#919AA0"/>

      <rect x="422" y="478" width="38" height="30" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
      <text x="441" y="498" fill="#4C565D">C</text>
      <rect x="476" y="489" width="120" height="7" rx="3.5" fill="#919AA0"/>
    </g>

    </g>

  </g>
