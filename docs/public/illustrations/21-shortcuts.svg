    <circle cx="109" cy="78" r="6" fill="#42C76B"/>
    <rect x="289" y="68" width="222" height="20" rx="10" fill="#E7E9E5"/>

    <rect x="44" y="102" width="174" height="644" fill="#FAFBF9"/>
    <line x1="218" y1="102" x2="218" y2="746" stroke="#D7E5FA" stroke-width="2"/>
    <rect x="70" y="137" width="82" height="8" rx="4" fill="#5F686E"/>
    <rect x="70" y="166" width="112" height="7" rx="3.5" fill="#929A9F"/>
    <rect x="60" y="205" width="142" height="122" rx="10" fill="#DDE9FA"/>
