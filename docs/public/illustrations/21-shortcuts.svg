  <!-- Contextual help and shortcuts panel. -->
  <g transform="translate(0 76)" filter="url(#panel-shadow)">
    <rect x="132" y="126" width="536" height="396" rx="16" fill="#FFFFFF" stroke="#D8DEE3"/>
    <rect x="132" y="126" width="536" height="58" rx="16" fill="#F5F7F9"/>
    <path d="M132 162h536v22H132z" fill="#F5F7F9"/>
    <line x1="132" y1="184" x2="668" y2="184" stroke="#D8DEE3"/>

    <path d="m154 146 14 14m0-14-14 14" stroke="#69737A" stroke-width="2.2" stroke-linecap="round"/>
    <text x="186" y="159" fill="#30383D" font-family="system-ui, sans-serif" font-size="15" font-weight="400">Help &amp; shortcuts</text>

    <g transform="translate(0 -14)">
    <text x="162" y="232" fill="#737E86" font-family="system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing=".8">GENERAL</text>
    <text x="418" y="232" fill="#737E86" font-family="system-ui, sans-serif" font-size="11" font-weight="750" letter-spacing=".8">WORKSPACE</text>

    <!-- The ? row is highlighted as the universal entry point. -->
