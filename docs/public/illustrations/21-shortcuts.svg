<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>Actions and shortcuts in the current review scope</title>
  <desc>A Personal document example with optional Edit, Chat, and Live enabled. Essential Review and Output actions also work in Shared. Personal review requires neither Admin nor Share. This is a sample of registered actions, not a directory of every product capability.</desc>
  <defs>
    <filter id="window-shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1F2937" flood-opacity=".04"/>
    </filter>
    <filter id="panel-shadow" x="-18%" y="-16%" width="136%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#27313A" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="#FAFAF7"/>

  <!-- Any-page context, deliberately softened behind the help surface. -->
  <g opacity=".48" filter="url(#window-shadow)">
    <rect x="44" y="54" width="712" height="692" rx="18" fill="#FFFFFF" stroke="#E1E5E0"/>
    <path d="M62 54h676a18 18 0 0 1 18 18v30H44V72a18 18 0 0 1 18-18z" fill="#F5F7F4"/>
    <circle cx="69" cy="78" r="6" fill="#FF6B61"/>
    <circle cx="89" cy="78" r="6" fill="#F6C451"/>
    <circle cx="109" cy="78" r="6" fill="#42C76B"/>
    <rect x="289" y="68" width="222" height="20" rx="10" fill="#E7E9E5"/>

    <rect x="44" y="102" width="174" height="644" fill="#FAFBF9"/>
    <line x1="218" y1="102" x2="218" y2="746" stroke="#D7E5FA" stroke-width="2"/>
    <rect x="70" y="137" width="82" height="8" rx="4" fill="#5F686E"/>
    <rect x="70" y="166" width="112" height="7" rx="3.5" fill="#929A9F"/>
    <rect x="60" y="205" width="142" height="122" rx="10" fill="#DDE9FA"/>
    <rect x="76" y="225" width="104" height="8" rx="4" fill="#5F686E"/>
    <rect x="86" y="253" width="72" height="7" rx="3.5" fill="#7CA5DC"/>
    <rect x="86" y="280" width="88" height="7" rx="3.5" fill="#858F95"/>
    <rect x="70" y="370" width="104" height="7" rx="3.5" fill="#929A9F"/>
    <rect x="70" y="404" width="82" height="7" rx="3.5" fill="#929A9F"/>
    <rect x="70" y="438" width="110" height="7" rx="3.5" fill="#929A9F"/>
    <rect x="70" y="472" width="72" height="7" rx="3.5" fill="#929A9F"/>

    <path d="M250 130h11l4 4h15v16h-30z" fill="#F7F8F5" stroke="#7E8489" stroke-width="1.4" stroke-linejoin="round"/>
    <rect x="300" y="136" width="70" height="7" rx="3.5" fill="#8E979D"/>
    <rect x="384" y="136" width="196" height="7" rx="3.5" fill="#A5ADB2"/>
    <rect x="250" y="190" width="284" height="16" rx="5" fill="#2F363B"/>
    <rect x="250" y="228" width="446" height="8" rx="4" fill="#9DA5AA"/>
    <rect x="250" y="250" width="390" height="8" rx="4" fill="#ADB4B8"/>
    <rect x="250" y="302" width="470" height="118" rx="10" fill="#FFFFFF" stroke="#DDE2E6"/>
    <rect x="270" y="330" width="402" height="8" rx="4" fill="#9EA6AC"/>
    <rect x="270" y="353" width="354" height="8" rx="4" fill="#AAB1B6"/>
    <rect x="250" y="462" width="436" height="8" rx="4" fill="#A7AEB3"/>
    <rect x="250" y="486" width="384" height="8" rx="4" fill="#B3B9BD"/>
  </g>

  <!-- Contextual help and shortcuts panel. -->
  <g transform="translate(0 76)" filter="url(#panel-shadow)">
    <rect x="132" y="126" width="536" height="396" rx="16" fill="#FFFFFF" stroke="#D8DEE3"/>
    <rect x="132" y="126" width="536" height="58" rx="16" fill="#F5F7F9"/>
    <path d="M132 162h536v22H132z" fill="#F5F7F9"/>
    <line x1="132" y1="184" x2="668" y2="184" stroke="#D8DEE3"/>

    <path d="m154 146 14 14m0-14-14 14" stroke="#69737A" stroke-width="2.2" stroke-linecap="round"/>
    <text x="186" y="159" fill="#30383D" font-family="system-ui, sans-serif" font-size="15" font-weight="400">Actions &amp; Shortcuts</text>

    <text x="644" y="159" fill="#737E86" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">Personal</text>

    <!-- A sample of actions registered on a Personal document page, with
         optional Edit, Chat, and Live. Review and Output need no Admin or Share. -->
    <text x="162" y="214" fill="#737E86" font-family="system-ui, sans-serif" font-size="10" font-weight="750" letter-spacing=".7">GLOBAL</text>
    <rect x="152" y="224" width="232" height="34" rx="8" fill="#EAF2FD" stroke="#BDD3F3"/>
    <rect x="166" y="228" width="38" height="26" rx="6" fill="#FFFFFF" stroke="#78A5ED"/>
    <text x="185" y="246" fill="#356FB9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="650" text-anchor="middle">?</text>
    <text x="218" y="246" fill="#626C74" font-family="system-ui, sans-serif" font-size="11">Actions &amp; Shortcuts</text>
    <rect x="166" y="263" width="44" height="26" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
    <text x="188" y="281" fill="#4C565D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="650" text-anchor="middle">Esc</text>
    <text x="224" y="281" fill="#626C74" font-family="system-ui, sans-serif" font-size="11">Close / clear focus</text>
    <text x="162" y="307" fill="#737E86" font-family="system-ui, sans-serif" font-size="10" font-weight="750" letter-spacing=".7">WORKSPACE</text>
    <rect x="166" y="318" width="38" height="26" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
    <text x="185" y="336" fill="#4C565D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="650" text-anchor="middle">/</text>
    <text x="218" y="336" fill="#626C74" font-family="system-ui, sans-serif" font-size="11">Spotlight</text>
    <text x="162" y="362" fill="#737E86" font-family="system-ui, sans-serif" font-size="10" font-weight="750" letter-spacing=".7">READING</text>
    <rect x="166" y="373" width="38" height="26" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
    <text x="185" y="391" fill="#4C565D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="650" text-anchor="middle">o</text>
    <text x="218" y="391" fill="#626C74" font-family="system-ui, sans-serif" font-size="11">Fold / Unfold</text>
    <text x="162" y="417" fill="#737E86" font-family="system-ui, sans-serif" font-size="10" font-weight="750" letter-spacing=".7">REVIEW</text>
    <rect x="166" y="428" width="38" height="26" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
    <text x="185" y="446" fill="#4C565D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="650" text-anchor="middle">v</text>
    <text x="218" y="446" fill="#626C74" font-family="system-ui, sans-serif" font-size="11">Progress</text>
    <rect x="166" y="463" width="56" height="26" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
    <text x="194" y="481" fill="#4C565D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="650" text-anchor="middle">⌘ z</text>
    <text x="236" y="481" fill="#626C74" font-family="system-ui, sans-serif" font-size="11">Undo</text>
    <text x="418" y="214" fill="#737E86" font-family="system-ui, sans-serif" font-size="10" font-weight="750" letter-spacing=".7">OUTPUT</text>
    <rect x="422" y="228" width="38" height="26" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
    <text x="441" y="246" fill="#4C565D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="650" text-anchor="middle">x</text>
    <text x="474" y="246" fill="#626C74" font-family="system-ui, sans-serif" font-size="11">Export Notes</text>
    <text x="418" y="307" fill="#737E86" font-family="system-ui, sans-serif" font-size="10" font-weight="750" letter-spacing=".7">EDIT</text>
    <rect x="422" y="318" width="38" height="26" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
    <text x="441" y="336" fill="#4C565D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="650" text-anchor="middle">e</text>
    <text x="474" y="336" fill="#626C74" font-family="system-ui, sans-serif" font-size="11">Edit source</text>
    <text x="418" y="362" fill="#737E86" font-family="system-ui, sans-serif" font-size="10" font-weight="750" letter-spacing=".7">WORKSPACE AI</text>
    <rect x="422" y="373" width="38" height="26" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
    <text x="441" y="391" fill="#4C565D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="650" text-anchor="middle">c</text>
    <text x="474" y="391" fill="#626C74" font-family="system-ui, sans-serif" font-size="11">Open Chat</text>
    <text x="418" y="417" fill="#737E86" font-family="system-ui, sans-serif" font-size="10" font-weight="750" letter-spacing=".7">LIVE</text>
    <rect x="422" y="428" width="38" height="26" rx="6" fill="#F7F8F9" stroke="#C7CFD5"/>
    <text x="441" y="446" fill="#4C565D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="650" text-anchor="middle">l</text>
    <text x="474" y="446" fill="#626C74" font-family="system-ui, sans-serif" font-size="11">Present / Follow</text>
    <line x1="152" y1="499" x2="648" y2="499" stroke="#E6E9EC"/>
    <text x="162" y="514" fill="#737E86" font-family="system-ui, sans-serif" font-size="9">Click an action or press its shortcut. Esc or ? closes this panel.</text>
  </g>
  <g fill="#69737A" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    <text x="400" y="646">Review and Output work in Personal or Shared</text>
    <text x="400" y="672">Personal needs no Admin or Share</text>
  </g>
</svg>
