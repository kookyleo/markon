<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <filter id="window-shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1F2937" flood-opacity=".05"/>
    </filter>
    <clipPath id="window-clip">
      <rect x="42" y="76" width="716" height="516" rx="18"/>
    </clipPath>
  </defs>

  <rect width="800" height="800" fill="#FAFAF7"/>

  <!-- Markdown editor using the same window shell as Export Notes. -->
  <g transform="translate(0 49)" filter="url(#window-shadow)">
    <rect x="42" y="76" width="716" height="516" rx="18" fill="#FFFFFF" stroke="#E1E5E0"/>
    <rect x="42" y="76" width="716" height="58" rx="18" fill="#F5F7F4"/>
    <path d="M42 112h716v22H42z" fill="#F5F7F4"/>

    <path d="m64 96 14 14m0-14-14 14" stroke="#69737A" stroke-width="2.2" stroke-linecap="round"/>
    <text x="96" y="109" fill="#30383D" font-family="system-ui, sans-serif" font-size="15" font-weight="400">Edit</text>

    <rect x="662" y="86" width="84" height="38" rx="6" fill="#78A7E3" stroke="#6896D1"/>
    <text x="704" y="110" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="650" text-anchor="middle">Save file</text>

    <g clip-path="url(#window-clip)">
      <!-- Markdown source -->
      <rect x="42" y="134" width="374" height="458" fill="#F6F8FA"/>
      <line x1="84" y1="134" x2="84" y2="592" stroke="#D0D7DE"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8B949E" text-anchor="end">
        <text x="72" y="174">1</text>
        <text x="72" y="202">2</text>
        <text x="72" y="230">3</text>
        <text x="72" y="258">4</text>
        <text x="72" y="286">5</text>
        <text x="72" y="314">6</text>
        <text x="72" y="342">7</text>
        <text x="72" y="370">8</text>
        <text x="72" y="398">9</text>
      </g>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#24292F">
        <text x="98" y="174" fill="#0550AE"># Title</text>
        <text x="98" y="230">Some intro <tspan fill="#953800">**bold**</tspan> text.</text>
        <text x="98" y="286" fill="#0550AE">- list item one</text>
        <text x="98" y="314" fill="#0550AE">- list item two</text>
        <text x="98" y="370" fill="#953800">```bash</text>
        <text x="98" y="398">$ markon serve</text>
      </g>
      <rect x="198" y="386" width="2" height="16" fill="#0969DA"/>

      <!-- Rendered preview -->
      <rect x="416" y="134" width="342" height="458" fill="#FFFFFF"/>
      <line x1="416" y1="134" x2="416" y2="592" stroke="#D5DDD7" stroke-width="3"/>
      <rect x="446" y="170" width="166" height="14" rx="3" fill="#111827"/>
      <rect x="446" y="214" width="252" height="8" rx="2" fill="#9CA3AF"/>
      <rect x="446" y="229" width="214" height="8" rx="2" fill="#9CA3AF"/>
      <circle cx="454" cy="268" r="3" fill="#3B82F6"/>
      <rect x="466" y="264" width="210" height="8" rx="2" fill="#9CA3AF"/>
      <circle cx="454" cy="289" r="3" fill="#3B82F6"/>
      <rect x="466" y="285" width="190" height="8" rx="2" fill="#9CA3AF"/>
      <rect x="446" y="328" width="264" height="58" rx="6" fill="#0F172A"/>
      <text x="460" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#86E5A4">$ markon serve</text>
    </g>
  </g>
</svg>
