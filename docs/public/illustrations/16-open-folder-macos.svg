      <stop offset=".48" stop-color="#FFFFFF"/>
      <stop offset=".72" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="lower-fade" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="800">
      <rect width="800" height="800" fill="url(#fade-gradient)"/>
    </mask>
  </defs>

  <rect width="800" height="800" fill="#FAFAF7"/>

