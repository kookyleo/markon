name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        # A mirror outage here once stalled this step silently for six hours
        # (2026-08-19, three jobs across two workflows), because nothing in
        # these workflows had a timeout and apt itself waits indefinitely.
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 update \
              && sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              libfontconfig1-dev \
              pkg-config \
              patchelf; then
              exit 0
            fi
            sudo apt-get clean
            sleep $((attempt * 10))
          done
          exit 1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets
        # `npm ci` and not `npm install`: install silently rewrites the
        # lockfile to whatever satisfies package.json, so drift never fails a
        # PR and surfaces weeks later in promote.yml, which does run `npm ci`.
        run: npm ci --no-audit --no-fund && npm run build

      # Surface test-only compile errors (e.g. `#[cfg(test)]` literals
      # falling out of sync with struct definitions) before they cascade
      # into a confusing `cargo test` failure.
      - name: Build all targets
        run: cargo build --tests --all-targets --workspace

      - name: Run tests
        run: cargo test --verbose

  package:
    name: Package
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        # A mirror outage here once stalled this step silently for six hours
        # (2026-08-19, three jobs across two workflows), because nothing in
        # these workflows had a timeout and apt itself waits indefinitely.
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 update \
              && sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              libfontconfig1-dev \
              pkg-config \
              patchelf; then
              exit 0
            fi
            sudo apt-get clean
            sleep $((attempt * 10))
          done
          exit 1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-package

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets
        # `npm ci` and not `npm install`: install silently rewrites the
        # lockfile to whatever satisfies package.json, so drift never fails a
        # PR and surfaces weeks later in promote.yml, which does run `npm ci`.
        run: npm ci --no-audit --no-fund && npm run build

      # Packages markon-core into the exact tarball crates.io would receive and
      # compiles it. This is the ONLY check that catches packaging regressions —
      # e.g. assets/dist/ dropped from `include` in crates/core/Cargo.toml. Plain
      # `cargo test` always passes because the bundle exists on disk; only the
      # packaged tarball reveals the gap, and by then the release is already cut.
      #
      # --allow-dirty is intentional: the included, gitignored assets/dist/ that
      # the step above produces always reads as dirty.
      - name: Verify markon-core would publish
        run: cargo publish --dry-run -p markon-core --allow-dirty

  clippy:
    name: Clippy
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        # A mirror outage here once stalled this step silently for six hours
        # (2026-08-19, three jobs across two workflows), because nothing in
        # these workflows had a timeout and apt itself waits indefinitely.
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Acquire::https::Timeout=30 update \
              && sudo apt-get install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              libfontconfig1-dev \
              pkg-config \
              patchelf; then
              exit 0
            fi
            sudo apt-get clean
            sleep $((attempt * 10))
          done
          exit 1

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets
        # `npm ci` and not `npm install`: install silently rewrites the
        # lockfile to whatever satisfies package.json, so drift never fails a
        # PR and surfaces weeks later in promote.yml, which does run `npm ci`.
        run: npm ci --no-audit --no-fund && npm run build

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  icons:
    name: Brand Icons
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-icons
          workspaces: ". -> target"

      - name: Verify generated icons are up to date
        run: cargo xtask icons --check

  ts:
    name: TS Tests & Lint
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Run TypeScript lint
        run: npm run lint
