name: Auto Bump

# Turn a merged pull request into a version bump on main. The bump is what the
# rest of the release pipeline keys off: auto-rc.yml watches pushes to main that
# change Cargo.toml's version, tags `vX.Y.Z-rc.N` and dispatches release.yml.
#
# The level is read from the merged PR's labels, so the release decision is
# recorded on the PR instead of being typed into a script by hand:
#
#   release:skip     -- no version change, no release at all
#   semver:breaking  -- 0.15.19 -> 0.16.0   (pre-1.0: breaking bumps MINOR)
#   semver:patch     -- 0.15.19 -> 0.15.20  (also the default when unlabelled)
#
# Quality is gated on the PR, not here: a PR cannot merge without CI (Test /
# Clippy / Format / TS Tests & Lint / Package), and this job only rewrites two
# version fields on top of that already-green commit.

on:
  pull_request:
    types: [closed]
    branches: [main]

# Serialize bumps. Two PRs merged back to back would otherwise race to push
# main, and the loser would die on a non-fast-forward.
concurrency:
  group: auto-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Resolve bump level from PR labels
        id: level
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          has() { jq -e --arg n "$1" 'index($n)' <<<"$LABELS_JSON" >/dev/null; }
          if has 'release:skip'; then
            LEVEL=skip
          elif has 'semver:breaking'; then
            LEVEL=breaking
          else
            # Unlabelled defaults to patch so bot-opened PRs (Dependabot et al.)
            # never stall the pipeline. Use release:skip to opt out.
            LEVEL=patch
          fi
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"
          echo "PR #${{ github.event.pull_request.number }} -> $LEVEL"

      # main is protected and the default GITHUB_TOKEN cannot push to it, so a
      # missing PAT means the bump silently never lands and no release is ever
      # cut. Fail loudly instead.
      - name: Require RELEASE_PUSH_TOKEN
        if: steps.level.outputs.level != 'skip'
        env:
          TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_PUSH_TOKEN is not configured — the version bump cannot be pushed to protected main. Add a PAT (admin account, contents:write) as that secret."
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.level.outputs.level != 'skip'
        with:
          ref: main
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Setup Rust
        if: steps.level.outputs.level != 'skip'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Bump, commit and push
        if: steps.level.outputs.level != 'skip'
        env:
          LEVEL: ${{ steps.level.outputs.level }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Each attempt re-derives the bump from whatever main currently is, so
          # a push rejected by a concurrent commit is retried against the new
          # tip rather than replaying a now-stale version number.
          attempt_bump() {
            git fetch --quiet origin main
            git reset --quiet --hard FETCH_HEAD

            local OLD MAJOR MINOR PATCH NEW RANGE changed expected
            OLD=$(grep -m1 '^version = ' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
            if ! [[ "$OLD" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::could not read a MAJOR.MINOR.PATCH version from Cargo.toml (got '$OLD')"
              return 2
            fi
            IFS=. read -r MAJOR MINOR PATCH <<<"$OLD"
            # 10# forces base 10: bash reads a bare 09 as octal and dies.
            MAJOR=$((10#$MAJOR)); MINOR=$((10#$MINOR)); PATCH=$((10#$PATCH))

            if [ "$LEVEL" = breaking ]; then
              # Pre-1.0 semver convention: a breaking change bumps MINOR,
              # because MAJOR 0 already means "no stability promise". This
              # branch has to be revisited at 1.0.
              if [ "$MAJOR" -eq 0 ]; then
                MINOR=$((MINOR + 1)); PATCH=0
              else
                MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
              fi
            else
              PATCH=$((PATCH + 1))
            fi

            NEW="$MAJOR.$MINOR.$PATCH"
            RANGE="$MAJOR.$MINOR"
            echo "$OLD -> $NEW ($LEVEL)"

            # workspace.package.version is the source of truth. The path dep on
            # markon-core carries a MAJOR.MINOR range, so it only moves when the
            # minor does — patch bumps leave it alone.
            sed -i -E "s/^version = \"[0-9]+\.[0-9]+\.[0-9]+\"/version = \"$NEW\"/" Cargo.toml
            sed -i -E "s|(markon-core = \{ path = \"crates/core\", version = )\"[0-9]+(\.[0-9]+)?\"|\1\"$RANGE\"|" Cargo.toml

            # Refresh the workspace member versions in Cargo.lock. `cargo
            # metadata` rewrites the lock without compiling anything, so this
            # job needs no system libraries and no frontend bundle.
            cargo metadata --format-version 1 >/dev/null

            # A bump must never carry anything else onto main.
            changed=$(git diff --name-only | sort -u)
            expected=$(printf 'Cargo.lock\nCargo.toml\n')
            if [ "$changed" != "$expected" ]; then
              echo "::error::expected only Cargo.toml + Cargo.lock to change, got: $changed"
              return 2
            fi

            git add Cargo.toml Cargo.lock
            git commit --quiet -m "chore: bump to $NEW" -m "Merged #${PR}: ${TITLE}"
            git push origin HEAD:main
          }

          for attempt in 1 2 3; do
            status=0
            attempt_bump || status=$?
            if [ "$status" -eq 0 ]; then
              echo "version bump pushed on attempt $attempt"
              exit 0
            fi
            # 2 is the sanity-check failure above: retrying cannot fix it.
            if [ "$status" -eq 2 ]; then
              exit 1
            fi
            echo "push rejected — main moved, retrying against the new tip"
          done
          echo "::error::could not push the version bump to main after 3 attempts"
          exit 1
